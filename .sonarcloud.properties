# SonarCloud automatic analysis scope.
# Analysed: the app (src/, server/, functions/, public/, index.html), its scripts (scripts/) and CI (.github/).
# Not analysed: offline research and promo tooling that never ships (tools/: the bot solver and arena, promo/: X images),
# and docs/. Unit tests (test/) are analysed as tests.
sonar.sources=.
sonar.exclusions=tools/**,promo/**,docs/**,test/**
sonar.tests=test
sonar.sourceEncoding=UTF-8
