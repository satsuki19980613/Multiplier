<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiplier</title>
<meta name="description" content="Multiplier — 3人で戦うポーカートーナメント。開始時に賞金の倍率が決まる、完全無料のプレイマネーゲーム。">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0D0F13">
<meta name="apple-mobile-web-app-title" content="Multiplier">
<link rel="stylesheet" href="/src/fonts.css">
<link rel="stylesheet" href="/src/style.css">
<script src="/theme.js"></script>
</head>
<body data-screen="menu">
<div class="app">
  <header class="top">
    <div class="brand"><span>Multiplier</span></div>
    <nav class="navpill" aria-label="メニュー">
      <button class="nbtn" id="rulesBtn" type="button" aria-label="Rules">?</button>
      <button class="nbtn ingame retire" id="retireBtn" type="button">Retire</button>
    </nav>
    <div class="top-r">
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="サウンド" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9.5v5h4l5 4v-13l-5 4z" fill="currentColor" stroke="none"/><g class="snd-waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.3 6.5a8 8 0 0 1 0 11"/></g><path class="snd-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="表示テーマを切り替える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
    </div>
  </header>

  <section class="menu" id="menu" aria-label="メニュー"><div class="menu-in" id="menuIn"></div></section>

  <main class="stage" id="stage" aria-label="テーブル">
    <div class="tinfo" id="tInfo"></div>
    <div class="table" id="table">
      <div class="felt" aria-hidden="true"></div>
      <div class="mid" id="mid">
        <div class="pot" id="pot"></div>
        <div class="boardc" id="boardC" aria-label="Community cards"></div>
      </div>
      <div class="seat opp pos-l" id="seatL"></div>
      <div class="seat opp pos-r" id="seatR"></div>
      <div class="seat me pos-m" id="seatM"></div>
      <div class="betm" id="betM"></div>
    </div>
    <div class="dock" id="dock" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <span>無料の娯楽ゲームです。チップに換金性はなく、購入・譲渡・景品交換もできません。18歳以上の方向け。</span>
    <span class="links"><a href="/terms.html">利用規約</a><a href="/privacy.html">プライバシーポリシー</a></span>
  </footer>
</div>

<div class="wheel" id="wheel" hidden></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="retireDlg" class="sm"><div class="dlg" id="retireBody"></div></dialog>
<dialog id="joinDlg" class="sm"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="joinBody"></div></dialog>
<dialog id="leaveDlg" class="sm"><div class="dlg" id="leaveBody"></div></dialog>
<dialog id="overDlg"><div class="dlg" id="overBody"></div></dialog>
<dialog id="rankDlg"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="rankBody"></div></dialog>
<dialog id="profDlg" class="sm"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="profBody"></div></dialog>
<dialog id="rulesDlg"><button class="x" data-close type="button" aria-label="閉じる"></button><div class="dlg" id="rulesBody"></div></dialog>

<script type="module" src="/src/main.js"></script>
</body>
</html>
